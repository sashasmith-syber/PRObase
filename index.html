<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIT PROfessor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
      body {
        transition: background 0.5s ease-in-out;
        background-color: #040504; /* Default hacker background */
        color: #39ff14; /* Default electric lime text */
      }
      /* Custom scrollbar for a more thematic look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #040504;
      }
      ::-webkit-scrollbar-thumb {
        background: #39ff14;
        border-radius: 0;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9dff8a;
      }
      /* Simple blinking animation for cursor */
      @keyframes blink {
        50% { opacity: 0; }
      }
      .cursor-blink {
        animation: blink 1s step-end infinite;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto Mono', 'sans-serif'],
              display: ['Orbitron', 'sans-serif'],
              tech: ['Share Tech Mono', 'monospace'],
              mono: ['VT323', 'monospace'],
            },
            colors: {
              'electric-lime': '#39ff14',
              'hacker-dark': '#040504',
            },
            boxShadow: {
                'glow': '0 0 3px rgba(57, 255, 20, 0.7), 0 0 6px rgba(57, 255, 20, 0.5)',
            },
            textShadow: {
              'glow': '0 0 8px rgba(57, 255, 20, 0.7)',
            },
            animation: {
              'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          },
        },
      }
    </script>
  <script type="importmap">

    "react-dom/": "https://esm.sh/react-dom@^19.1.0/"
  }
}
</script>
</head>

  </body>
</html>
